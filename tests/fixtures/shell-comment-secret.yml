# 複審 round 5 fixture：secret 表達式只出現在 shell 註解行裡。
# 註解不會執行、不會落 log。
# S2 保守標記策略前先用 strip_shell_comments 剝掉整行註解 → 應為 OK、不誤標。
name: Shell Comment Secret
